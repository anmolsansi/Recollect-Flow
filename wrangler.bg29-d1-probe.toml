# BG-29 D1-only diagnostic; NEVER use the production wrangler.toml.
# No R2, AI, Notion, secrets, routes, or external providers.
# This does NOT satisfy full BG-29.078 multi-stage pipeline acceptance.
name = "recollect-flow-bg29-d1-cron-probe"
main = "scripts/bg29-d1-cron-probe-worker.mjs"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "recollect-flow-bg29-staging"
database_id = "b5cbeccc-92fb-4bbc-9597-f0174b84e57d"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1

# Explicitly remove any previously installed hourly Cron when redeploying.
[triggers]
crons = []
