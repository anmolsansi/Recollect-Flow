name: OPE-227 breaker atomic apply

on:
  push:
    branches:
      - agent/ope-227-capacity-controls

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-227-capacity-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make breaker failure transition atomic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/worker-api/src/jobs/ai/circuit-breaker.repository.ts')
          text = path.read_text()
          text = text.replace(
              "  CIRCUIT_BREAKER_PROBE_LEASE_MS,\n  circuitOpenUntil,\n",
              "  CIRCUIT_BREAKER_BASE_COOLDOWN_MS,\n  CIRCUIT_BREAKER_MAX_COOLDOWN_MS,\n  CIRCUIT_BREAKER_PROBE_LEASE_MS,\n",
          )

          method = r'''  async recordFailure(
    provider: CapacityProvider,
    operation: CapacityOperation,
    errorCode: string,
    now: Date = new Date(),
  ): Promise<CircuitBreakerSnapshot> {
    const nowIso = now.toISOString();
    const probe5 = new Date(
      now.getTime() + CIRCUIT_BREAKER_BASE_COOLDOWN_MS,
    ).toISOString();
    const probe10 = new Date(
      now.getTime() + CIRCUIT_BREAKER_BASE_COOLDOWN_MS * 2,
    ).toISOString();
    const probe20 = new Date(
      now.getTime() + CIRCUIT_BREAKER_BASE_COOLDOWN_MS * 4,
    ).toISOString();
    const probe40 = new Date(
      now.getTime() + CIRCUIT_BREAKER_BASE_COOLDOWN_MS * 8,
    ).toISOString();
    const probeMax = new Date(
      now.getTime() + CIRCUIT_BREAKER_MAX_COOLDOWN_MS,
    ).toISOString();

    const row = await this.db
      .prepare(
        `INSERT INTO ai_circuit_breakers (
           provider, operation, state, consecutive_failures,
           last_failure_at, last_error_code, policy_version,
           created_at, updated_at
         ) VALUES (?1, ?2, 'closed', 1, ?3, ?4, ?5, ?3, ?3)
         ON CONFLICT(provider, operation) DO UPDATE SET
           state = CASE
             WHEN ai_circuit_breakers.consecutive_failures + 1 >= ?6 THEN 'open'
             ELSE 'closed'
           END,
           consecutive_failures = ai_circuit_breakers.consecutive_failures + 1,
           opened_at = CASE
             WHEN ai_circuit_breakers.consecutive_failures + 1 >= ?6
               THEN COALESCE(ai_circuit_breakers.opened_at, ?3)
             ELSE ai_circuit_breakers.opened_at
           END,
           next_probe_at = CASE
             WHEN ai_circuit_breakers.consecutive_failures + 1 < ?6 THEN NULL
             WHEN ai_circuit_breakers.consecutive_failures + 1 = ?6 THEN ?7
             WHEN ai_circuit_breakers.consecutive_failures + 1 = ?6 + 1 THEN ?8
             WHEN ai_circuit_breakers.consecutive_failures + 1 = ?6 + 2 THEN ?9
             WHEN ai_circuit_breakers.consecutive_failures + 1 = ?6 + 3 THEN ?10
             ELSE ?11
           END,
           probe_lease_owner = CASE
             WHEN ai_circuit_breakers.consecutive_failures + 1 >= ?6 THEN NULL
             ELSE ai_circuit_breakers.probe_lease_owner
           END,
           probe_lease_expires_at = CASE
             WHEN ai_circuit_breakers.consecutive_failures + 1 >= ?6 THEN NULL
             ELSE ai_circuit_breakers.probe_lease_expires_at
           END,
           last_failure_at = excluded.last_failure_at,
           last_error_code = excluded.last_error_code,
           policy_version = excluded.policy_version,
           updated_at = excluded.updated_at
         RETURNING provider, operation, state, consecutive_failures, next_probe_at,
                   probe_lease_owner, probe_lease_expires_at, last_success_at,
                   last_failure_at, last_error_code`,
      )
      .bind(
        provider,
        operation,
        nowIso,
        errorCode,
        AI_CAPACITY_POLICY_VERSION,
        CIRCUIT_BREAKER_FAILURE_THRESHOLD,
        probe5,
        probe10,
        probe20,
        probe40,
        probeMax,
      )
      .first<BreakerRow>();
    if (!row) throw new Error('Failed to record provider circuit failure');
    return toSnapshot(row);
  }
'''

          pattern = re.compile(
              r"  async recordFailure\([\s\S]*?\n  }\n}\n$",
              re.M,
          )
          if not pattern.search(text):
              raise SystemExit('recordFailure method block not found')
          text = pattern.sub(method + '}\n', text)
          path.write_text(text)
          PY
          npx prettier --write apps/worker-api/src/jobs/ai/circuit-breaker.repository.ts
          rm .github/workflows/ope227-breaker-atomic-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker-api/src/jobs/ai/circuit-breaker.repository.ts .github/workflows/ope227-breaker-atomic-apply.yml
          git commit -m 'fix(ope-227): atomically open breaker at failure threshold'
          git push origin HEAD:agent/ope-227-capacity-controls
