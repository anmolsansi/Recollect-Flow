name: BG29 isolated branch formatter

on:
  push:
    branches:
      - feat/bg-29-resilience-capacity-performance

permissions:
  contents: write

jobs:
  format-bg29:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only BG29-owned files and create traceable commit
        run: |
          npx prettier --write \
            scripts/bg29-capture-bench.mjs \
            scripts/bg29-capture-bench.test.mjs \
            scripts/run-bg29-capture-bench.mjs \
            apps/worker-api/test/bg29-search-scale.d1.spec.ts \
            apps/worker-api/test/bg29-provider-outage.d1.spec.ts \
            apps/worker-api/test/bg29-privacy-matrix.test.ts \
            docs/verification/BG-29_RESILIENCE_ACCEPTANCE.md
          git add scripts/bg29-capture-bench.mjs scripts/bg29-capture-bench.test.mjs \
            scripts/run-bg29-capture-bench.mjs \
            apps/worker-api/test/bg29-search-scale.d1.spec.ts \
            apps/worker-api/test/bg29-provider-outage.d1.spec.ts \
            apps/worker-api/test/bg29-privacy-matrix.test.ts \
            docs/verification/BG-29_RESILIENCE_ACCEPTANCE.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style(bg29): format scoped acceptance files [07/50] (#99)'
            git push origin HEAD:refs/heads/feat/bg-29-resilience-capacity-performance
          fi
