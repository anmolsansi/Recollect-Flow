name: BG-12 Markdown audit formatting (temporary)

on:
  push:
    branches: [docs/bg12-markdown-audit-20261010]

permissions:
  contents: write

concurrency:
  group: bg12-markdown-audit-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/bg12-markdown-audit-20261010
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write README.md apps/worker-api/test/aggregate-processing-state.test.ts docs/API.md docs/API_SPEC.md docs/BUILD_STATUS.md docs/RELEASE_ROADMAP.md docs/repo_context.md docs/README.md docs/verification/README.md docs/verification/BG-11_FINAL_CLOSEOUT.md docs/verification/BG-11_URL_RECOVERY.md docs/URL_ACQUISITION_CONTRACT.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md docs/RECOLLECTFLOW_BUILD_GUIDE.md docs/verification/BG-12_FINAL_CLOSEOUT.md docs/verification/BG-12_MARKDOWN_AUDIT_2026-10-10.md
      - name: Commit only scoped formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md apps/worker-api/test/aggregate-processing-state.test.ts docs/API.md docs/API_SPEC.md docs/BUILD_STATUS.md docs/RELEASE_ROADMAP.md docs/repo_context.md docs/README.md docs/verification/README.md docs/verification/BG-11_FINAL_CLOSEOUT.md docs/verification/BG-11_URL_RECOVERY.md docs/URL_ACQUISITION_CONTRACT.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md docs/RECOLLECTFLOW_BUILD_GUIDE.md docs/verification/BG-12_FINAL_CLOSEOUT.md docs/verification/BG-12_MARKDOWN_AUDIT_2026-10-10.md
          git commit -m 'style(bg12): normalize Markdown audit corrections and restored fixture (#56)'
          git push origin HEAD:docs/bg12-markdown-audit-20261010
