name: BG29 dependency recovery formatter
on:
  push:
    branches: [feat/bg-29-resilience-capacity-performance]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format BG29 dependency recovery fixture
        run: |
          npx prettier --write apps/worker-api/test/bg29-dependency-recovery.d1.spec.ts docs/verification/BG-29_RESILIENCE_ACCEPTANCE.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
          git add apps/worker-api/test/bg29-dependency-recovery.d1.spec.ts docs/verification/BG-29_RESILIENCE_ACCEPTANCE.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(bg29): format isolated outage recovery and final reconciliation (#99)'
            git push origin HEAD:refs/heads/feat/bg-29-resilience-capacity-performance
          fi
