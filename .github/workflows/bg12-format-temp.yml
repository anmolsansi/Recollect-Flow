name: BG-12 task formatting (temporary)

on:
  push:
    branches: [agent/bg-12-aggregate-status]

permissions:
  contents: write

concurrency:
  group: bg12-scope-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-12-aggregate-status
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/worker-api/src/jobs/aggregate-processing-state.ts apps/worker-api/test/aggregate-processing-state.test.ts docs/verification/BG-12_AGGREGATE_STATE_CONTRACT.md docs/RECOLLECTFLOW_BUILD_GUIDE.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md docs/README.md docs/verification/README.md docs/RELEASE_ROADMAP.md docs/BUILD_STATUS.md
      - name: Commit scoped formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker-api/src/jobs/aggregate-processing-state.ts apps/worker-api/test/aggregate-processing-state.test.ts docs/verification/BG-12_AGGREGATE_STATE_CONTRACT.md docs/RECOLLECTFLOW_BUILD_GUIDE.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md docs/README.md docs/verification/README.md docs/RELEASE_ROADMAP.md docs/BUILD_STATUS.md
          git commit -m 'style(bg-12): normalize aggregate contract and fixtures (#56)'
          git push origin HEAD:agent/bg-12-aggregate-status
