name: BG13 final race formatter
on:
  push:
    branches: [agent/bg-13-atomic-transitions]
permissions:
  contents: write
concurrency:
  group: bg13-final-race-format
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-13-atomic-transitions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/worker-api/test/job-and-sync.d1.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker-api/test/job-and-sync.d1.spec.ts
          git commit -m 'style(bg13): format final purge-race proof'
          git push origin HEAD:agent/bg-13-atomic-transitions
