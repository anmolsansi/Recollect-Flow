name: BG17 single-file format preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write scripts/verify-browser-recovery.mjs
          node -e 'const fs=require("fs");process.stdout.write("BG17_FORMAT_JSON "+JSON.stringify({path:"scripts/verify-browser-recovery.mjs",data:fs.readFileSync("scripts/verify-browser-recovery.mjs").toString("base64")})+"\\n")'
