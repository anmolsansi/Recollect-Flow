name: BG17 temporary format preview
on:
  pull_request:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show formatted source for BG-17
        run: |
          npx prettier --write apps/web/src/App.tsx apps/web/src/capture-model.ts apps/web/src/capture-recovery.ts apps/web/src/capture-recovery.test.ts apps/web/src/CaptureForm.tsx scripts/verify-browser-recovery.mjs
          node -e 'const fs=require("fs"); for(const p of ["apps/web/src/App.tsx","apps/web/src/capture-model.ts","apps/web/src/capture-recovery.ts","apps/web/src/capture-recovery.test.ts","apps/web/src/CaptureForm.tsx","scripts/verify-browser-recovery.mjs"]){ process.stdout.write("BG17_FORMAT_JSON "+JSON.stringify({path:p,data:fs.readFileSync(p).toString("base64")})+"\\n"); }'
