name: BG17 temporary format preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and emit changed sources
        run: |
          npx prettier --write apps/web/src/CaptureForm.tsx apps/web/src/capture-recovery.ts apps/web/src/capture-recovery.test.ts scripts/verify-browser-recovery.mjs docs/RECOLLECTFLOW_BUILD_GUIDE.md docs/RECOLLECTFLOW_ENGINEERING_PLAN.md docs/RELEASE_ROADMAP.md apps/web/README.md
          node -e 'const fs=require("fs"); for(const p of ["apps/web/src/CaptureForm.tsx","apps/web/src/capture-recovery.ts","apps/web/src/capture-recovery.test.ts","scripts/verify-browser-recovery.mjs","docs/RECOLLECTFLOW_BUILD_GUIDE.md","docs/RECOLLECTFLOW_ENGINEERING_PLAN.md","docs/RELEASE_ROADMAP.md","apps/web/README.md"]){process.stdout.write("BG17_FORMAT_JSON "+JSON.stringify({path:p,data:fs.readFileSync(p).toString("base64")})+"\\n");}'
