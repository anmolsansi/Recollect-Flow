name: BG25 isolated format and focused proof
on:
  push:
    branches:
      - feat/bg-25-auth-request-log-hardening
    paths:
      - 'apps/worker-api/**'
      - 'wrangler.toml'
      - 'docs/**'
      - '.github/workflows/bg25-diagnostic.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Show exact required formatting, without pushing or modifying tracked remote files
        run: |
          npx prettier --write apps/worker-api/src/app.ts apps/worker-api/src/auth/login-abuse.ts apps/worker-api/src/shared/errors.ts apps/worker-api/test/bg25-security.test.ts apps/worker-api/src/captures/capture.service.ts apps/worker-api/src/shortcut/shortcut.service.ts apps/worker-api/src/jobs/extraction/extraction.worker.ts docs/verification/BG-25_SECURITY_HARDENING.md docs/SECURITY_PRIVACY_GOVERNANCE.md docs/verification/README.md docs/RECOLLECTFLOW_BUILD_GUIDE.md
          git diff -- apps/worker-api docs/verification/BG-25_SECURITY_HARDENING.md docs/SECURITY_PRIVACY_GOVERNANCE.md docs/verification/README.md docs/RECOLLECTFLOW_BUILD_GUIDE.md
      - name: Targeted lint typecheck and security test on formatted disposable checkout
        run: |
          npm run lint
          npm run typecheck
          npx vitest run --config vitest.node.config.ts apps/worker-api/test/bg25-security.test.ts
