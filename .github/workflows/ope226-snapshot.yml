name: OPE-226 source snapshot

on:
  push:
    branches:
      - agent/ope-226-digests

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ope226-repository-snapshot
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
