name: OPE-227 freeze development workflows

on:
  push:
    branches:
      - agent/ope-227-capacity-controls

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-227-capacity-controls
      - name: Remove temporary development workflows
        shell: bash
        run: |
          rm -f .github/workflows/ope227-branch-ci.yml
          rm -f .github/workflows/ope227-validation-report.yml
          rm -f .github/workflows/ope227-wrangler-types-apply.yml
          rm -f .github/workflows/ope227-docs-apply.yml
          rm -f .github/workflows/ope227-final-gate.yml
          rm -f .github/workflows/ope227-cloudflare-scope-apply.yml
          rm -f .github/workflows/ope227-breaker-atomic-apply.yml
          rm -f .github/workflows/ope227-jobservice-deferral-apply.yml
          rm -f .github/workflows/ope227-stop-dev-workflows.yml
          rm -f docs/tickets/OPE-227-VALIDATION.tmp.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci(ope-227): remove temporary development workflows'
          git pull --rebase origin agent/ope-227-capacity-controls
          git push origin HEAD:agent/ope-227-capacity-controls
