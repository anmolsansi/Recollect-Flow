name: BG29 focused acceptance
on:
  pull_request:
    paths:
      - 'apps/worker-api/test/bg29-dependency-recovery.d1.spec.ts'
      - 'apps/worker-api/test/bg29-schema-failure.test.ts'
      - 'apps/worker-api/test/bg29-upload-pressure.d1.spec.ts'
      - 'apps/worker-api/test/bg29-multistage-drain.d1.spec.ts'
      - 'scripts/bg29-worker-resource.mjs'
      - 'scripts/bg29-zero-cost-preflight.mjs'
      - 'scripts/bg29-zero-cost-preflight.test.mjs'
      - 'scripts/bg29-hourly-evidence-check.mjs'
      - 'scripts/bg29-hourly-evidence-check.test.mjs'
      - 'scripts/bg29-d1-cron-probe-worker.mjs'
      - 'scripts/bg29-d1-cron-probe.test.mjs'
      - 'scripts/bg29-d1-probe-config.test.mjs'
      - 'wrangler.bg29-d1-probe.toml'
      - 'wrangler.bg29-d1-probe-cron.toml'
      - 'docs/verification/BG-29_D1_ONLY_DEPLOY_GUIDE.md'
      - 'wrangler.bg29-staging.example.toml'
      - 'scripts/bg29-inspector-connection.mjs'
      - 'scripts/bg29-inspector-connection.test.mjs'
      - 'scripts/browser-acceptance-runtime.mjs'
      - 'apps/worker-api/src/jobs/ai/ai-provider.registry.ts'
      - '.github/workflows/bg29-focused.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/bg29-inspector-connection.test.mjs
      - run: node --test scripts/bg29-zero-cost-preflight.test.mjs
      - run: node scripts/bg29-zero-cost-preflight.mjs
      - run: node --test scripts/bg29-hourly-evidence-check.test.mjs
      - run: node --test scripts/bg29-d1-cron-probe.test.mjs scripts/bg29-d1-probe-config.test.mjs
      - run: npx wrangler deploy --config wrangler.bg29-d1-probe.toml --dry-run
      - run: npx wrangler deploy --config wrangler.bg29-d1-probe-cron.toml --dry-run
      - name: BG29 isolated Worker CPU/heap profile (diagnostic only)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run bg29:resource:profile
      - run: npx vitest run --config vitest.d1.config.ts apps/worker-api/test/bg29-dependency-recovery.d1.spec.ts
      - run: npx vitest run --config vitest.node.config.ts apps/worker-api/test/bg29-schema-failure.test.ts
      - run: npx vitest run --config vitest.d1.config.ts apps/worker-api/test/bg29-upload-pressure.d1.spec.ts
      - run: npx vitest run --config vitest.d1.config.ts apps/worker-api/test/bg29-multistage-drain.d1.spec.ts
