name: BG-03 evidence formatter

on:
  push:
    branches:
      - agent/ope-323-bg-03-release-smoke-edit-version

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-323-bg-03-release-smoke-edit-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format BG-03 evidence
        run: npx prettier --write docs/verification/BG-03_CHECKLIST_RECONCILIATION.md docs/verification/BG-03_RELEASE_SMOKE_EDIT_VERSION.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verification/BG-03_CHECKLIST_RECONCILIATION.md docs/verification/BG-03_RELEASE_SMOKE_EDIT_VERSION.md
          git commit -m "style(bg-03): normalize verification evidence [23/24] (#27)"
          git push origin HEAD:agent/ope-323-bg-03-release-smoke-edit-version
