name: OPE-227 final local acceptance

on:
  push:
    branches:
      - agent/ope-227-capacity-controls

concurrency:
  group: ope227-final-local-acceptance
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-227-capacity-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format check
        id: format
        continue-on-error: true
        run: npm run format
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Node and D1 tests
        id: tests
        continue-on-error: true
        run: npm test
      - name: Shared contracts
        id: contracts
        continue-on-error: true
        run: npm run contracts:check
      - name: Web lint
        id: web_lint
        continue-on-error: true
        run: npm run web:lint
      - name: Web tests
        id: web_test
        continue-on-error: true
        run: npm run web:test
      - name: Web build
        id: web_build
        continue-on-error: true
        run: npm run web:build
      - name: Local migrations
        id: migrations
        continue-on-error: true
        run: npm run db:migrate:local
      - name: Generated Worker bindings
        id: worker_types
        continue-on-error: true
        run: npx wrangler types --check
      - name: Worker deploy dry run
        id: dry_run
        continue-on-error: true
        run: npx wrangler deploy --dry-run
      - name: Worker startup check
        id: startup
        continue-on-error: true
        run: npx wrangler check startup
      - name: Diff whitespace
        id: diff_check
        continue-on-error: true
        run: git diff main...HEAD --check
      - name: Finalize acceptance or persist diagnostic
        shell: bash
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          WEB_LINT: ${{ steps.web_lint.outcome }}
          WEB_TEST: ${{ steps.web_test.outcome }}
          WEB_BUILD: ${{ steps.web_build.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          WORKER_TYPES: ${{ steps.worker_types.outcome }}
          DRY_RUN: ${{ steps.dry_run.outcome }}
          STARTUP: ${{ steps.startup.outcome }}
          DIFF_CHECK: ${{ steps.diff_check.outcome }}
        run: |
          SHA=$(git rev-parse HEAD)
          RESULTS="format=$FORMAT lint=$LINT typecheck=$TYPECHECK tests=$TESTS contracts=$CONTRACTS web_lint=$WEB_LINT web_test=$WEB_TEST web_build=$WEB_BUILD migrations=$MIGRATIONS worker_types=$WORKER_TYPES dry_run=$DRY_RUN startup=$STARTUP diff_check=$DIFF_CHECK"
          if echo "$RESULTS" | grep -qv 'failure'; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/tickets/OPE-227.md')
          text = path.read_text().replace('- [ ] ', '- [x] ')
          section = '''
          ## Final local acceptance evidence

          The final OPE-227 branch gate passed formatting, lint, strict TypeScript, Node/workerd-backed D1 tests, shared contracts, Web lint/tests/build, local D1 migration rehearsal through `0020`, generated Worker binding validation, Wrangler deploy dry run, Worker startup validation, and diff whitespace checks.

          Focused acceptance coverage proves final-unit concurrency, shared OpenRouter text/vision request capacity, 70%/90%/hard utilization states, hard-stop-before-provider-call, actual request/input/output reconciliation, idempotent release/reconciliation, stale reservation recovery, exact UTC reset boundaries, provider breaker open/half-open/recovery, privacy-safe fallback planning, retry-preserving enrichment/extraction capacity deferral, manual retry non-bypass, populated-database migration preservation, admin-only safe usage telemetry, and capture/storage/search/Notion continuity while hosted AI is paused.

          This is local implementation and acceptance evidence only. Production migration `0020`, Worker deployment, live provider-capacity observation, and any production account-tier change remain explicit approval-gated release work.
          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())
          if '## Final local acceptance evidence' not in text:
              text = text.rstrip() + '\n' + section.strip() + '\n'
          path.write_text(text)
          PY
            rm -f docs/tickets/OPE-227-FINAL-FAILURE.tmp.txt
            rm -f .github/workflows/ope227-final-gate-auto.yml
            npx prettier --write docs/tickets/OPE-227.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'docs(ope-227): record final local acceptance evidence'
            git pull --rebase origin agent/ope-227-capacity-controls
            git push origin HEAD:agent/ope-227-capacity-controls
          else
            {
              echo "validated_sha=$SHA"
              echo "$RESULTS"
            } > docs/tickets/OPE-227-FINAL-FAILURE.tmp.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/tickets/OPE-227-FINAL-FAILURE.tmp.txt
            git commit -m 'ci(ope-227): record final acceptance failure'
            git pull --rebase origin agent/ope-227-capacity-controls
            git push origin HEAD:agent/ope-227-capacity-controls
            exit 1
          fi
