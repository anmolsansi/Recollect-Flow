name: BG25 format probe (temporary)
on:
  push:
    branches:
      - feat/bg-25-auth-request-log-hardening
    paths:
      - 'apps/worker-api/**'
      - '.github/workflows/bg25-format-probe.yml'
jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only disposable CI workspace and report diff
        run: |
          npx prettier --write apps/worker-api/src/app.ts apps/worker-api/src/auth/auth.routes.ts apps/worker-api/test/bg25-security.test.ts
          git diff -- apps/worker-api/src/app.ts apps/worker-api/src/auth/auth.routes.ts apps/worker-api/test/bg25-security.test.ts
      - name: Run exact focused gate on formatted disposable CI workspace
        run: |
          npm run lint
          npm run typecheck
          npx vitest run --config vitest.node.config.ts apps/worker-api/test/bg25-security.test.ts
