name: BG-11 closeout formatting (temporary)

on:
  push:
    branches: [agent/bg-11-final-closeout]

permissions:
  contents: write

concurrency:
  group: bg11-closeout-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-11-final-closeout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/verification/BG-11_FINAL_CLOSEOUT.md
      - name: Commit formatted closeout
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/BG-11_FINAL_CLOSEOUT.md
          git commit -m 'style(bg-11): format merged-main final closeout (#53)'
          git push origin HEAD:agent/bg-11-final-closeout
