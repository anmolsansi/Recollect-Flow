name: BG-11 temporary formatter

on:
  push:
    branches:
      - agent/bg-11-url-recovery

permissions:
  contents: write

concurrency:
  group: bg11-format
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-11-url-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format BG-11 files only
        run: |
          npx prettier --write \
            apps/worker-api/src/jobs/extraction/source-recovery.policy.ts \
            apps/worker-api/src/jobs/extraction/source-recovery.service.ts \
            apps/worker-api/src/jobs/extraction/source-recovery.routes.ts \
            apps/worker-api/src/jobs/extraction/source-evidence.service.ts \
            apps/worker-api/test/source-recovery.d1.spec.ts \
            apps/worker-api/src/app.ts \
            apps/web/src/source-recovery.ts \
            apps/web/src/App.tsx \
            packages/contracts/src/item.ts \
            apps/worker-api/src/jobs/extraction/source-retry-after.ts \
            apps/worker-api/src/jobs/extraction/source-fetcher.types.ts \
            apps/worker-api/src/jobs/extraction/source-fetcher.ts \
            apps/worker-api/src/jobs/extraction/source-acquisition.schema.ts \
            apps/worker-api/src/jobs/extraction/source-acquisition.service.ts \
            apps/worker-api/test/source-retry-after.test.ts \
            docs/verification/BG-11_URL_RECOVERY.md
      - name: Commit scoped formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker-api/src/jobs/extraction/source-recovery.policy.ts \
            apps/worker-api/src/jobs/extraction/source-recovery.service.ts \
            apps/worker-api/src/jobs/extraction/source-recovery.routes.ts \
            apps/worker-api/src/jobs/extraction/source-evidence.service.ts \
            apps/worker-api/test/source-recovery.d1.spec.ts \
            apps/worker-api/src/app.ts apps/web/src/source-recovery.ts \
            apps/web/src/App.tsx packages/contracts/src/item.ts \
            apps/worker-api/src/jobs/extraction/source-retry-after.ts \
            apps/worker-api/src/jobs/extraction/source-fetcher.types.ts \
            apps/worker-api/src/jobs/extraction/source-fetcher.ts \
            apps/worker-api/src/jobs/extraction/source-acquisition.schema.ts \
            apps/worker-api/src/jobs/extraction/source-acquisition.service.ts \
            apps/worker-api/test/source-retry-after.test.ts \
            docs/verification/BG-11_URL_RECOVERY.md
          git commit -m 'style(source): format BG-11 implementation (#53)'
          git push origin HEAD:agent/bg-11-url-recovery
