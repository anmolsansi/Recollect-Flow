name: BG-12 closeout formatting (temporary)

on:
  push:
    branches: [agent/bg-12-final-closeout]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-12-final-closeout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/verification/BG-12_FINAL_CLOSEOUT.md docs/verification/BG-12_AGGREGATE_STATE_CONTRACT.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md docs/BUILD_STATUS.md docs/verification/README.md docs/RELEASE_ROADMAP.md
      - name: Commit scoped formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/BG-12_FINAL_CLOSEOUT.md docs/verification/BG-12_AGGREGATE_STATE_CONTRACT.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md docs/BUILD_STATUS.md docs/verification/README.md docs/RELEASE_ROADMAP.md
          git commit -m 'style(bg-12): format final closeout evidence (#56)'
          git push origin HEAD:agent/bg-12-final-closeout
