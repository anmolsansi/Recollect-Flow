name: BG-01 format once

on:
  push:
    branches:
      - agent/ope-321-bg-01-reproducible-baseline

permissions:
  contents: write

concurrency:
  group: bg01-format-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-321-bg-01-reproducible-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/verification/*.md
      - name: Commit normalized verification docs
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/*.md
          git commit -m 'style(bg-01): normalize verification evidence [09/10] (#23)'
          git push origin HEAD:agent/ope-321-bg-01-reproducible-baseline
