name: BG-03 docs format once

on:
  push:
    branches:
      - agent/ope-323-bg-03-release-smoke-edit-version

permissions:
  contents: write

concurrency:
  group: bg03-docs-format-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-323-bg-03-release-smoke-edit-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/verification/BG-03_RELEASE_SMOKE_EDIT_VERSION.md docs/verification/BG-03_CHECKLIST_RECONCILIATION.md
      - name: Commit normalized BG-03 evidence
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/BG-03_RELEASE_SMOKE_EDIT_VERSION.md docs/verification/BG-03_CHECKLIST_RECONCILIATION.md
          git commit -m 'style(bg-03): normalize verification evidence [23/24] (#27)'
          git push origin HEAD:agent/ope-323-bg-03-release-smoke-edit-version
