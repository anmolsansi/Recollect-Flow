name: BG-03 format once

on:
  push:
    branches:
      - agent/ope-323-bg-03-release-smoke-edit-version

permissions:
  contents: write

concurrency:
  group: bg03-format-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-323-bg-03-release-smoke-edit-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/verify-production-release.mjs scripts/verify-production-release.test.mjs
      - name: Commit normalized verifier files
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-production-release.mjs scripts/verify-production-release.test.mjs
          git commit -m 'style(release-smoke): normalize verifier files [22/24] (#27)'
          git push origin HEAD:agent/ope-323-bg-03-release-smoke-edit-version
