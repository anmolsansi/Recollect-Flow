name: OPE-227 Wrangler types apply

on:
  push:
    branches:
      - agent/ope-227-capacity-controls

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-227-capacity-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler types
      - name: Commit generated types when needed
        run: |
          if git diff --quiet; then
            echo 'Worker types already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-configuration.d.ts
          git commit -m 'chore(ope-227): regenerate Worker binding types'
          git push origin HEAD:agent/ope-227-capacity-controls
