name: BG-04 checklist reconciliation

on:
  push:
    branches:
      - agent/ope-324-bg-04-smoke-story-setup

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-324-bg-04-smoke-story-setup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mark BG-04.001 through BG-04.099 complete
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md')
          text = path.read_text()
          start = text.index('## BG-04 — 100 executable microtasks')
          end = text.index('## BG-05 — 100 executable microtasks')
          before, section, after = text[:start], text[start:end], text[end:]
          for number in range(1, 100):
              token = f'- [ ] `BG-04.{number:03d}`'
              checked = f'- [x] `BG-04.{number:03d}`'
              if token in section:
                  section = section.replace(token, checked, 1)
              elif checked not in section:
                  raise SystemExit(f'Missing checklist token {token}')
          pending = '- [ ] `BG-04.100`'
          checked_final = '- [x] `BG-04.100`'
          if checked_final in section:
              section = section.replace(checked_final, pending, 1)
          elif pending not in section:
              raise SystemExit('Missing BG-04.100 checklist token')
          path.write_text(before + section + after)
          PY
      - run: npx prettier --write docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
      - name: Commit checklist reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
          git commit -m "docs(bg-04): mark pre-merge checklist 99 of 100 [31/32] (#31)"
          git push origin HEAD:agent/ope-324-bg-04-smoke-story-setup
