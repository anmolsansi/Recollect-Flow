name: BG-02 focused proof

on:
  pull_request:
    branches: [main]

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run usage regression once
        run: npx vitest run --config vitest.d1.config.ts apps/worker-api/test/capacity-usage.d1.spec.ts
      - name: Run usage regression twice
        run: npx vitest run --config vitest.d1.config.ts apps/worker-api/test/capacity-usage.d1.spec.ts
      - name: Run usage regression beside core capacity tests
        run: npx vitest run --config vitest.d1.config.ts apps/worker-api/test/capacity-usage.d1.spec.ts apps/worker-api/test/capacity.d1.spec.ts
