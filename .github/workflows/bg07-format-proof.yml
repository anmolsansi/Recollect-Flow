name: BG-07 Formatter Proof

on:
  push:
    branches:
      - agent/ope-327-bg-07-browser-download

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format BG-07 documentation
        run: |
          npx prettier --write             docs/verification/BG-07_BROWSER_DOWNLOAD.md             docs/verification/BG-07_CHECKLIST_RECONCILIATION.md             docs/RECOLLECTFLOW_BUILD_GUIDE.md             docs/verification/README.md             docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
      - name: Show formatter delta
        run: |
          git diff --check
          git diff --             docs/verification/BG-07_BROWSER_DOWNLOAD.md             docs/verification/BG-07_CHECKLIST_RECONCILIATION.md             docs/RECOLLECTFLOW_BUILD_GUIDE.md             docs/verification/README.md             docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
