name: BG-21 scoped formatter

on:
  push:
    branches: [feat/bg-21-static-assets-routing]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bg-21-static-assets-routing
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format BG-21 files
        run: |
          npx prettier --write \
            apps/worker-api/src/assets/asset-router.ts \
            apps/worker-api/src/index.ts \
            apps/worker-api/test/asset-router.test.ts \
            apps/worker-api/test/asset-dispatch.test.ts \
            scripts/web-release.mjs \
            scripts/web-release.test.mjs \
            scripts/bg21-preview-runtime.mjs \
            scripts/verify-web-hosting.mjs \
            docs/verification/BG-21_WEB_HOSTING.md \
            docs/OPERATIONS.md \
            docs/RECOLLECTFLOW_BUILD_GUIDE.md \
            docs/RECOLLECTFLOW_ENGINEERING_PLAN.md \
            docs/RELEASE_ROADMAP.md \
            docs/BUILD_STATUS.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker-api/src/assets apps/worker-api/src/index.ts apps/worker-api/test/asset-router.test.ts apps/worker-api/test/asset-dispatch.test.ts scripts/web-release.mjs scripts/web-release.test.mjs scripts/bg21-preview-runtime.mjs scripts/verify-web-hosting.mjs docs/verification/BG-21_WEB_HOSTING.md docs/OPERATIONS.md docs/RECOLLECTFLOW_BUILD_GUIDE.md docs/RECOLLECTFLOW_ENGINEERING_PLAN.md docs/RELEASE_ROADMAP.md docs/BUILD_STATUS.md
          git commit -m 'style(bg-21): format new hosting and verification files (#83)'
          git push origin HEAD:feat/bg-21-static-assets-routing
