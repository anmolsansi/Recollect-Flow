name: BG-13 final format pass

on:
  push:
    branches:
      - agent/bg-13-atomic-transitions

permissions:
  contents: write

concurrency:
  group: bg13-final-format-pass
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-13-atomic-transitions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write .
      - name: Commit verified formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(bg13): normalize D1 tests, routes and docs (#61)'
          git push origin HEAD:agent/bg-13-atomic-transitions
