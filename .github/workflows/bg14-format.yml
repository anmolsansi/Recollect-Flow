name: BG-14 format branch once
on:
  push:
    branches:
      - agent/bg-14-browser-workflow
permissions:
  contents: write
concurrency:
  group: bg14-format
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-14-browser-workflow
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write .
      - name: Commit formatting when necessary
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(bg-14): normalize browser acceptance code [16/50] (#63)'
          git push origin HEAD:agent/bg-14-browser-workflow
