name: BG25 Documentation Format Diagnostic (temporary)
on:
  push:
    branches:
      - feat/bg-25-auth-request-log-hardening
    paths:
      - docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
      - .github/workflows/bg25-doc-format-diagnostic.yml
jobs:
  formatter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Show authoritative Prettier change in disposable checkout
        run: |
          npx prettier --write docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
          git diff -- docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
