name: Apply OPE-248 recovery fixes

on:
  push:
    branches:
      - agent/ope-248-recovery-ux-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-248-recovery-ux-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply fixes
        run: python3 scripts/apply_ope248_recovery_fixes.py
      - name: Format
        run: npm run format:write
      - name: Validate
        run: npm run check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/item-actions.ts apps/web/src/item-actions.test.ts apps/worker-api/src/search/search.service.ts apps/worker-api/test/search.d1.spec.ts scripts/apply_ope248_recovery_fixes.py .github/workflows/apply-ope248-recovery-fixes.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix OPE-248 recovery actions and feedback UX"
          git push
