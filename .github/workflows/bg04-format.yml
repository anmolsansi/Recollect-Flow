name: BG-04 formatter

on:
  push:
    branches:
      - agent/ope-324-bg-04-smoke-story-setup

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-324-bg-04-smoke-story-setup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/verify-production-release.mjs scripts/verify-production-release.test.mjs
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- scripts/verify-production-release.mjs scripts/verify-production-release.test.mjs; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-production-release.mjs scripts/verify-production-release.test.mjs
          git commit -m "chore(smoke): apply Prettier formatting [30/32] (#31)"
          git push origin HEAD:agent/ope-324-bg-04-smoke-story-setup
