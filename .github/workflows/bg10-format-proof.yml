name: BG10 Format Proof

on:
  push:
    branches:
      - agent/ope-330-bg-10-url-evidence-chain

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format BG-10 files
        run: |
          npx prettier --write             apps/worker-api/src/jobs/extraction/source-acquisition.service.ts             apps/worker-api/src/jobs/extraction/source-acquisition.worker.ts             apps/worker-api/test/recovery-migration.d1.spec.ts             apps/worker-api/test/source-acquisition.d1.spec.ts             docs/RECOLLECTFLOW_BUILD_GUIDE.md             docs/URL_ACQUISITION_CONTRACT.md             packages/contracts/src/item.ts
      - uses: actions/upload-artifact@v4
        with:
          name: bg10-prettier-output
          path: |
            apps/worker-api/src/jobs/extraction/source-acquisition.service.ts
            apps/worker-api/src/jobs/extraction/source-acquisition.worker.ts
            apps/worker-api/test/recovery-migration.d1.spec.ts
            apps/worker-api/test/source-acquisition.d1.spec.ts
            docs/RECOLLECTFLOW_BUILD_GUIDE.md
            docs/URL_ACQUISITION_CONTRACT.md
            packages/contracts/src/item.ts
