name: BG-11 diagnostic script formatting (temporary)

on:
  push:
    branches: [agent/bg-11-url-recovery]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-11-url-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/verify-browser-source-recovery.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-browser-source-recovery.mjs
          git commit -m 'style(bg-11): normalize browser diagnostic (#53)'
          git push origin HEAD:agent/bg-11-url-recovery
