name: BG-05 Candidate Proof

on:
  push:
    branches:
      - agent/ope-325-bg-05-priority-1-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification candidate
        uses: actions/checkout@v4
        with:
          ref: 3179b1d1601142d8d071285d06aa3630e3f0742c

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Record candidate and toolchain
        run: |
          echo "candidate=$(git rev-parse HEAD)"
          node --version
          npm --version
          npx wrangler --version

      - name: Build Worker without deploying
        run: |
          rm -rf .bg05-worker-bundle
          npx wrangler deploy --dry-run --outdir .bg05-worker-bundle
          test -n "$(find .bg05-worker-bundle -type f -print -quit)"
          find .bg05-worker-bundle -maxdepth 2 -type f -print | sort

      - name: Apply migrations to fresh isolated local state
        run: |
          rm -rf .wrangler/state
          npm run db:migrate:local

      - name: Run corrected release smoke against isolated local Worker
        shell: bash
        run: |
          set -euo pipefail
          cp .dev.vars.example .dev.vars
          npm run dev:api > /tmp/bg05-api.log 2>&1 &
          API_PID=$!
          cleanup() {
            kill "$API_PID" 2>/dev/null || true
            wait "$API_PID" 2>/dev/null || true
            rm -f .dev.vars
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/api/v1/health > /tmp/bg05-health.json; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/bg05-api.log
            exit 1
          fi

          cat /tmp/bg05-health.json
          WORKER_BASE_URL=http://127.0.0.1:8787 \
          CAPTURE_TOKEN=local-capture-token \
          ADMIN_TOKEN=local-admin-token \
          node scripts/verify-production-release.mjs | tee /tmp/bg05-smoke.json

      - name: Confirm proof did not deploy remotely
        run: |
          echo "Worker command used --dry-run only. Smoke target was 127.0.0.1. No remote migration or deployment command was executed."
