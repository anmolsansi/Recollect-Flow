name: BG-14 focused source-acquisition proof
on:
  push:
    branches:
      - agent/bg-14-browser-workflow
permissions:
  contents: write
concurrency:
  group: bg14-acquisition-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-14-browser-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/verify-browser-acquisition.mjs
      - name: Commit isolated probe format
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-browser-acquisition.mjs
          git commit -m 'style(bg-14): normalize acquired-source probe [24/50] (#63)'
          git push origin HEAD:agent/bg-14-browser-workflow
      - run: google-chrome --version
      - run: npm run browser:acquisition:test
