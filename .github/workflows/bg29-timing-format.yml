name: BG29 scope timings formatter
on:
  push:
    branches: [feat/bg-29-resilience-capacity-performance]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only BG29 timing and cancellation fixtures
        run: |
          npx prettier --write apps/worker-api/test/bg29-upload-pressure.d1.spec.ts apps/worker-api/test/bg29-dependency-recovery.d1.spec.ts
          git add apps/worker-api/test/bg29-upload-pressure.d1.spec.ts apps/worker-api/test/bg29-dependency-recovery.d1.spec.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(bg29): format isolated stage timings and stream interruption (#99)'
            git push origin HEAD:refs/heads/feat/bg-29-resilience-capacity-performance
          fi
