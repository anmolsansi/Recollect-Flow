name: BG-21 evidence formatter

on:
  push:
    branches: [feat/bg-21-static-assets-routing]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bg-21-static-assets-routing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/verification/BG-21_WEB_HOSTING.md
      - name: Commit BG-21 evidence formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/BG-21_WEB_HOSTING.md
          git commit -m 'style(bg-21): normalize acceptance evidence formatting (#83)'
          git push origin HEAD:feat/bg-21-static-assets-routing
