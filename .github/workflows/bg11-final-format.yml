name: BG-11 checklist format once

on:
  push:
    branches: [agent/bg-11-url-recovery]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-11-url-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
      - name: Commit checklist format only
        run: |
          if git diff --quiet -- docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
          git commit -m 'style(bg-11): normalize verified checklist (#53)'
          git push origin HEAD:agent/bg-11-url-recovery
