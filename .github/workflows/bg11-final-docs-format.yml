name: BG-11 final documentation formatter

on:
  push:
    branches: [agent/bg-11-url-recovery]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-11-url-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/verification/BG-11_URL_RECOVERY.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md docs/BUILD_STATUS.md docs/API_SPEC.md docs/verification/README.md
      - name: Commit scoped documentation formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/BG-11_URL_RECOVERY.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md docs/BUILD_STATUS.md docs/API_SPEC.md docs/verification/README.md
          git commit -m 'style(bg-11): normalize acceptance records (#53)'
          git push origin HEAD:agent/bg-11-url-recovery
