name: BG17 final closeout format
on:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write docs/verification/BG-17_FINAL_CLOSEOUT.md
          node -e 'const fs=require("fs");const p="docs/verification/BG-17_FINAL_CLOSEOUT.md";process.stdout.write("BG17_DOC_JSON "+JSON.stringify({path:p,data:fs.readFileSync(p).toString("base64")})+"\\n")'
