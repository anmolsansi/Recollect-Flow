name: BG-27 normalize evidence file

on:
  push:
    branches:
      - feat/bg-27-digest-review-reconciliation

permissions:
  contents: write

concurrency:
  group: bg27-format-evidence
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bg-27-digest-review-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/verification/BG-27_DIGEST_REVIEW.md
      - name: Commit scoped evidence formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/BG-27_DIGEST_REVIEW.md
          git commit -m 'style(digests): normalize BG-27 evidence [58/50] (#94)'
          git push origin HEAD:feat/bg-27-digest-review-reconciliation
