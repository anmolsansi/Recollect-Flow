name: BG-02 format proof

on:
  pull_request:
    branches: [main]

jobs:
  format-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format BG-02 evidence
        run: npx prettier --write docs/verification/BG-02_USAGE_CLOCK_STABILIZATION.md
      - name: Show formatter diff
        run: git diff -- docs/verification/BG-02_USAGE_CLOCK_STABILIZATION.md
