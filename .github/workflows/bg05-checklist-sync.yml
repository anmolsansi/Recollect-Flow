name: BG-05 Checklist Sync

on:
  push:
    branches:
      - agent/ope-325-bg-05-checklist-sync

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, 'mark authoritative checklist complete') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ope-325-bg-05-checklist-sync

      - name: Mark exactly the 100 BG-05 microtasks complete
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md")
          text = path.read_text()
          pending = "- [ ] `BG-05."
          complete = "- [x] `BG-05."

          count = text.count(pending)
          if count != 100:
              raise SystemExit(f"Expected exactly 100 unchecked BG-05 tasks, found {count}")

          updated = text.replace(pending, complete)
          if updated.count(pending) != 0:
              raise SystemExit("Unchecked BG-05 tasks remain after replacement")
          if updated.count(complete) != 100:
              raise SystemExit("Completed BG-05 task count is not exactly 100")

          path.write_text(updated)
          PY

      - name: Review and commit only the authoritative checklist
        run: |
          git diff --check
          git diff -- docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
          test "$(git status --short | wc -l)" -eq 1
          git config user.name "anmolsansi"
          git config user.email "143311415+anmolsansi@users.noreply.github.com"
          git add docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
          git commit -m "docs(bg05): mark authoritative checklist complete [100/100] (#34)"
          git push origin HEAD:agent/ope-325-bg-05-checklist-sync
