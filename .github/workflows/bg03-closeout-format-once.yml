name: BG-03 closeout formatter

on:
  push:
    branches:
      - agent/ope-323-bg-03-closeout

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-323-bg-03-closeout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format closeout evidence and remove formatter
        run: |
          npx prettier --write docs/verification/BG-03_FINAL_CLOSEOUT.md docs/verification/README.md
          git rm .github/workflows/bg03-closeout-format-once.yml
      - name: Commit normalized closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verification/BG-03_FINAL_CLOSEOUT.md docs/verification/README.md
          git commit -m "style(bg-03): normalize final closeout [24/24] (#27)"
          git push
