name: OPE-227 final gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-227-capacity-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full repository quality gate
        run: npm run check
      - name: Local migration rehearsal
        run: npm run db:migrate:local
      - name: Generated Worker bindings
        run: npx wrangler types --check
      - name: Worker deploy dry run
        run: npx wrangler deploy --dry-run
      - name: Worker startup check
        run: npx wrangler check startup
      - name: Diff whitespace check
        run: git diff main...HEAD --check
      - name: Record acceptance and remove temporary development machinery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ticket = Path('docs/tickets/OPE-227.md')
          text = ticket.read_text()
          text = text.replace('- [ ] ', '- [x] ')
          evidence = '''\n## Final local acceptance evidence\n\nThe final OPE-227 branch gate passed the repository-wide quality suite, local D1 migration rehearsal through migration `0020`, generated Worker binding check, Wrangler deployment dry run, Worker startup check, and whitespace validation. Focused unit/workerd-backed acceptance coverage proves final-unit concurrency, shared OpenRouter text/vision capacity, 70%/90%/hard states, hard-stop-before-provider-call, actual-usage reconciliation, idempotent release/reconciliation, reservation expiry, exact UTC reset boundaries, breaker open/half-open/recovery, privacy-safe fallback planning, retry-preserving capacity deferral, manual-retry non-bypass, populated-database migration preservation, admin-only usage telemetry, and capture/storage/search/Notion continuity while hosted AI is paused.\n\nThis is local implementation/acceptance evidence only. Production migration `0020`, Worker deployment, live quota observation, and any production provider-account-tier changes remain explicit approval-gated release work.\n'''
          if '## Final local acceptance evidence' not in text:
              text = text.rstrip() + '\n' + evidence
          ticket.write_text(text)
          PY

          rm -f .github/workflows/ope227-branch-ci.yml
          rm -f .github/workflows/ope227-validation-report.yml
          rm -f .github/workflows/ope227-wrangler-types-apply.yml
          rm -f .github/workflows/ope227-docs-apply.yml
          rm -f .github/workflows/ope227-final-gate.yml
          rm -f docs/tickets/OPE-227-VALIDATION.tmp.txt

          npx prettier --write docs/tickets/OPE-227.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ope-227): record final local acceptance evidence'
          git push origin HEAD:agent/ope-227-capacity-controls
