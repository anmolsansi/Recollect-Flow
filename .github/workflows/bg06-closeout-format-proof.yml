name: BG-06 closeout format proof

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format closeout reconciliation
        run: npx prettier --write docs/verification/BG-06_CHECKLIST_RECONCILIATION.md
      - name: Capture formatter diff
        run: git diff -- docs/verification/BG-06_CHECKLIST_RECONCILIATION.md > bg06-closeout-prettier.diff
      - uses: actions/upload-artifact@v4
        with:
          name: bg06-closeout-prettier
          path: bg06-closeout-prettier.diff
