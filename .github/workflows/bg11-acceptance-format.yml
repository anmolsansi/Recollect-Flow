name: BG-11 acceptance formatting (temporary)

on:
  push:
    branches: [agent/bg-11-url-recovery]

permissions:
  contents: write

concurrency:
  group: bg11-acceptance-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bg-11-url-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/verify-browser-source-recovery.mjs apps/worker-api/test/source-recovery.d1.spec.ts docs/verification/BG-11_URL_RECOVERY.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md docs/RECOLLECTFLOW_BUILD_GUIDE.md docs/RELEASE_ROADMAP.md docs/URL_ACQUISITION_CONTRACT.md docs/verification/README.md docs/README.md docs/API.md docs/API.md docs/API.md
      - name: Commit scoped formatting only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-browser-source-recovery.mjs             apps/worker-api/test/source-recovery.d1.spec.ts             docs/verification/BG-11_URL_RECOVERY.md             docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md             docs/RECOLLECTFLOW_BUILD_GUIDE.md             docs/RELEASE_ROADMAP.md             docs/URL_ACQUISITION_CONTRACT.md             docs/verification/README.md docs/README.md
          git commit -m 'style(bg-11): format final acceptance evidence (#53)'
          git push origin HEAD:agent/bg-11-url-recovery
