name: OPE-227 JobService deferral apply

on:
  push:
    branches:
      - agent/ope-227-capacity-controls

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-227-capacity-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Route capacity failures through retry-preserving deferral
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/worker-api/src/jobs/job.service.ts')
          text = path.read_text()
          import_line = "import { CapacityJobService } from './capacity-job.service';\n"
          if import_line not in text:
              marker = "import { AppError } from '../shared/errors';\n"
              if marker not in text:
                  raise SystemExit('JobService AppError import marker not found')
              text = text.replace(marker, marker + import_line, 1)

          signature = """  async failProcessingJob(\n    jobId: string,\n    ownerId: string,\n    errorCode: string,\n    retryable: boolean,\n    now = new Date(),\n  ): Promise<boolean> {\n"""
          if signature not in text:
              raise SystemExit('failProcessingJob signature not found')
          guard = signature + """    if (\n      errorCode === 'QUOTA_PAUSED' ||\n      errorCode === 'PROVIDER_UNAVAILABLE' ||\n      errorCode === 'NO_ELIGIBLE_PROVIDER' ||\n      errorCode === 'ZERO_COST_GUARD_REJECTED'\n    ) {\n      const delayMs =\n        errorCode === 'PROVIDER_UNAVAILABLE'\n          ? 5 * 60_000\n          : errorCode === 'QUOTA_PAUSED'\n            ? 60 * 60_000\n            : 24 * 60 * 60_000;\n      return new CapacityJobService(this.db).deferProcessingJob(\n        jobId,\n        ownerId,\n        errorCode,\n        new Date(now.getTime() + delayMs),\n        now,\n      );\n    }\n\n"""
          if "errorCode === 'QUOTA_PAUSED'" not in text:
              text = text.replace(signature, guard, 1)
          path.write_text(text)
          PY
          npx prettier --write apps/worker-api/src/jobs/job.service.ts
          rm .github/workflows/ope227-jobservice-deferral-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker-api/src/jobs/job.service.ts .github/workflows/ope227-jobservice-deferral-apply.yml
          git commit -m 'fix(ope-227): preserve retries for all capacity-failed processing jobs'
          git push origin HEAD:agent/ope-227-capacity-controls
