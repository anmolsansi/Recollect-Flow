name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show BG-08 Prettier diff
        run: |
          npx prettier --write docs/URL_ACQUISITION_CONTRACT.md docs/verification/BG-08_URL_ACQUISITION_CONTRACT.md
          git diff -- docs/URL_ACQUISITION_CONTRACT.md docs/verification/BG-08_URL_ACQUISITION_CONTRACT.md
          exit 1
      - run: npm run check
      - run: npm run db:migrate:local
      - run: google-chrome --version
      - run: npm run browser:download:test
