name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:package:test
      - run: npm run release:package
      - run: npx wrangler deploy --dry-run --outdir /tmp/bg21-worker
      - name: Check isolated staging config and Worker dry-run (no remote writes)
        env:
          CLOUDFLARE_ACCOUNT_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BG_STAGING_WORKER_NAME: recollect-flow-bg21-bg22-staging
          BG_STAGING_D1_NAME: recollect-flow-bg21-bg22-staging
          BG_STAGING_D1_ID: 11111111-2222-4333-8444-555555555555
          BG_STAGING_R2_BUCKET: recollect-flow-attachments-bg21-bg22-staging
        run: |
          npm run staging:prepare
          npm run staging:verify
          npx wrangler deploy --config .bg21-staging-preview.toml --dry-run --outdir /tmp/bg21-staging-worker
      - run: npm run db:migrate:local
      - run: google-chrome --version
      - run: npm run browser:hosting:test
      - run: npm run browser:creation:test
      - run: node scripts/verify-browser-optional-outage.mjs
      - run: node scripts/verify-browser-upload-reauth.mjs
      - run: node scripts/verify-browser-follow-up.mjs --bundled
      - run: node scripts/verify-browser-recovery.mjs --bundled
      - run: node scripts/verify-browser-file-upload.mjs --bundled
      - run: npm run browser:capture:test
      - run: npm run browser:follow-up:test
      - run: npm run browser:file-upload:test
      - run: npm run browser:recovery:test
      - run: npm run browser:download:test
      - run: npm run browser:source-recovery:test
      - run: npm run browser:workflow:test
      - run: npm run browser:acquisition:test
      - run: npm run browser:workflow:test
      - run: npm run browser:acquisition:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bg14-browser-failure
          path: artifacts/bg14/
          if-no-files-found: ignore
          retention-days: 3
