name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: BG07 formatter diagnostic
        run: |
          npx prettier --write apps/worker-api/src/attachments/attachment.routes.ts apps/worker-api/test/attachment.test.ts scripts/browser-acceptance-fixtures.mjs scripts/browser-cdp.mjs scripts/verify-browser-download.mjs
          git diff -- apps/worker-api/src/attachments/attachment.routes.ts apps/worker-api/test/attachment.test.ts scripts/browser-acceptance-fixtures.mjs scripts/browser-cdp.mjs scripts/verify-browser-download.mjs
          exit 1
      - run: npm run check
      - run: npm run db:migrate:local
      - run: google-chrome --version
      - run: npm run browser:download:test
