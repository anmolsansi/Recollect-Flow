name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Temporary BG21_REMOTE_FORMAT diagnostic
        run: |
          npx prettier --write scripts/verify-remote-hosting.mjs
          echo 'BG21_REMOTE_FORMAT_BEGIN'
          base64 -w0 scripts/verify-remote-hosting.mjs
          echo
          echo 'BG21_REMOTE_FORMAT_END'
          exit 1
      - run: npm run check
      - run: npm run release:package:test
      - run: npm run release:package
      - run: npx wrangler deploy --dry-run --outdir /tmp/bg21-worker
      - run: npm run db:migrate:local
      - run: google-chrome --version
      - run: npm run browser:hosting:test
      - run: node scripts/verify-browser-file-upload.mjs --bundled
      - run: npm run browser:capture:test
      - run: npm run browser:follow-up:test
      - run: npm run browser:file-upload:test
      - run: npm run browser:recovery:test
      - run: npm run browser:download:test
      - run: npm run browser:source-recovery:test
      - run: npm run browser:workflow:test
      - run: npm run browser:acquisition:test
      - run: npm run browser:workflow:test
      - run: npm run browser:acquisition:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bg14-browser-failure
          path: artifacts/bg14/
          if-no-files-found: ignore
          retention-days: 3
