name: BG-04 final checklist closeout

on:
  push:
    branches:
      - agent/ope-324-bg-04-final-closeout

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-324-bg-04-final-closeout
      - name: Mark BG-04.100 complete
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md')
          text = path.read_text()
          start = text.index('## BG-04 — 100 executable microtasks')
          end = text.index('## BG-05 — 100 executable microtasks')
          before, section, after = text[:start], text[start:end], text[end:]
          pending = '- [ ] `BG-04.100`'
          checked = '- [x] `BG-04.100`'
          if pending in section:
              section = section.replace(pending, checked, 1)
          elif checked not in section:
              raise SystemExit('Missing BG-04.100 checklist token')
          path.write_text(before + section + after)
          PY
      - name: Commit checklist closeout
        run: |
          if git diff --quiet -- docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md; then
            echo "BG-04.100 is already checked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
          git commit -m "docs(bg-04): mark checklist 100 of 100 [32/32] (#31)"
          git push origin HEAD:agent/ope-324-bg-04-final-closeout
