name: OPE-227 Cloudflare scope apply

on:
  push:
    branches:
      - agent/ope-227-capacity-controls

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-227-capacity-controls
      - name: Share provider-class rate windows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/worker-api/src/jobs/ai/capacity.policy.ts')
          text = path.read_text()
          old = """    const perMinute = operation === 'vision_extract' ? 720 : 300;\n    return {\n      provider,\n      operation,\n      freeModels: Object.keys(CLOUDFLARE_NEURON_RATES),\n      windows: [\n        requestWindow(\n          provider,\n          `${CLOUDFLARE_FREE_SCOPE}:${operation}`,\n          'minute',\n          MINUTE_MS,\n          perMinute,\n        ),\n        cloudflareDailyWindow(env),\n      ],\n    };\n"""
          new = """    const rateClass =\n      operation === 'vision_extract' ? 'image-to-text' : 'text-generation';\n    const perMinute = operation === 'vision_extract' ? 720 : 300;\n    return {\n      provider,\n      operation,\n      freeModels: Object.keys(CLOUDFLARE_NEURON_RATES),\n      windows: [\n        requestWindow(\n          provider,\n          `${CLOUDFLARE_FREE_SCOPE}:${rateClass}`,\n          'minute',\n          MINUTE_MS,\n          perMinute,\n        ),\n        cloudflareDailyWindow(env),\n      ],\n    };\n"""
          if old not in text:
              raise SystemExit('Expected Cloudflare policy block not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/ope227-cloudflare-scope-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker-api/src/jobs/ai/capacity.policy.ts .github/workflows/ope227-cloudflare-scope-apply.yml
          git commit -m 'fix(ope-227): share Cloudflare rate windows by provider class'
          git push origin HEAD:agent/ope-227-capacity-controls
