name: Apply OPE-226 implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-226-digests
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore implementation patch
        run: |
          cat scripts/ope226-patch/part-* | tr -d '[:space:]' | base64 --decode > /tmp/ope226-patch.tar.gz
          echo "e64ad36a024830495e713cd4bd33a93b82c2a1a0e501cebb1718c7b281cbe6ae  /tmp/ope226-patch.tar.gz" | sha256sum --check
          tar -xzf /tmp/ope226-patch.tar.gz
          rm -rf scripts/ope226-patch
          rm -f .github/workflows/apply-ope226.yml
          rm -f .github/workflows/ope226-snapshot.yml
      - name: Apply validation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer_path = Path('apps/worker-api/src/digests/digest.renderer.ts')
          renderer = renderer_path.read_text()
          marker = 'function invalidAiText(value: string): boolean {'
          helper = '''function containsControlCharacters(value: string): boolean {
            return Array.from(value).some((character) => {
              const code = character.charCodeAt(0);
              return (
                (code >= 0 && code <= 8) ||
                code === 11 ||
                code === 12 ||
                (code >= 14 && code <= 31) ||
                code === 127
              );
            });
          }

          '''
          if marker not in renderer:
              raise RuntimeError('Digest AI validation marker not found')
          renderer = renderer.replace(marker, helper + marker, 1)
          control_regex = r'/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/u.test(value)'
          if control_regex not in renderer:
              raise RuntimeError('Digest AI control regex not found')
          renderer = renderer.replace(
              control_regex,
              'containsControlCharacters(value)',
              1,
          )
          renderer_path.write_text(renderer)

          env_path = Path('apps/worker-api/src/env.ts')
          env_source = env_path.read_text()
          before = '''type ConfigurableAiVars =
            | 'AI_PROVIDER_DEFAULT'
            | 'AI_PROVIDERS_ENABLED'
            | 'AI_PROVIDER_IMPLEMENTATIONS';'''
          after = '''type ConfigurableAiVars =
            | 'AI_PROVIDER_DEFAULT'
            | 'AI_PROVIDERS_ENABLED'
            | 'AI_PROVIDER_IMPLEMENTATIONS'
            | 'DIGEST_AI_ENABLED'
            | 'WEB_INBOX_BASE_URL';'''
          if before not in env_source:
              raise RuntimeError('Configurable environment marker not found')
          env_path.write_text(env_source.replace(before, after, 1))

          test_path = Path('apps/worker-api/test/digest.d1.spec.ts')
          test_source = test_path.read_text()
          replacements = {
              "new Date('2026-08-03T00:00:00.000Z'),\n    );\n    expect(firstLease)": "new Date('2026-08-03T03:00:00.000Z'),\n    );\n    expect(firstLease)",
              "now: () => new Date('2026-08-03T00:02:00.000Z'),": "now: () => new Date('2026-08-03T03:02:00.000Z'),",
              "now: () => new Date('2026-08-03T00:00:00.000Z'),\n      fetcher: vi.fn().mockResolvedValue(": "now: () => new Date('2026-08-03T03:00:00.000Z'),\n      fetcher: vi.fn().mockResolvedValue(",
              "availableAt: '2026-08-03T00:00:30.000Z',": "availableAt: '2026-08-03T03:00:30.000Z',",
          }
          for before_test, after_test in replacements.items():
              if test_source.count(before_test) != 1:
                  raise RuntimeError(
                      f'Expected one digest test clock marker: {before_test!r}'
                  )
              test_source = test_source.replace(before_test, after_test, 1)
          test_path.write_text(test_source)
          PY
      - run: npm ci
      - name: Regenerate Worker environment types
        run: npx wrangler types
      - name: Format
        run: |
          npm run format:write
          npm run format:write
      - name: Validate
        run: |
          npm run check
          npm run db:migrate:local
          npx wrangler deploy --dry-run
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement OPE-226 daily and weekly digest jobs"
          git push
