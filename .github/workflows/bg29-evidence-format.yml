name: BG29 evidence formatting
on:
  push:
    branches: [feat/bg-29-resilience-capacity-performance]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only BG29 evidence and checklist
        run: |
          npx prettier --write docs/verification/BG-29_RESILIENCE_ACCEPTANCE.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
          git add docs/verification/BG-29_RESILIENCE_ACCEPTANCE.md docs/RECOLLECTFLOW_MICROTASK_CHECKLIST.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(bg29): format measured evidence and checklist [47/50] (#99)'
            git push origin HEAD:refs/heads/feat/bg-29-resilience-capacity-performance
          fi
