name: BG17 final temporary format review
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prettier exact output
        run: |
          npx prettier --write apps/web/src/capture-file-recovery.ts apps/web/src/capture-file-recovery.test.ts apps/web/src/capture-recovery.ts apps/web/src/capture-recovery.test.ts apps/web/src/CaptureForm.tsx scripts/verify-browser-recovery.mjs
          node -e 'const fs=require("fs");for(const p of ["apps/web/src/capture-file-recovery.ts","apps/web/src/capture-file-recovery.test.ts","apps/web/src/capture-recovery.ts","apps/web/src/capture-recovery.test.ts","apps/web/src/CaptureForm.tsx","scripts/verify-browser-recovery.mjs"]){process.stdout.write("BG17_FORMAT_JSON "+JSON.stringify({path:p,data:fs.readFileSync(p).toString("base64")})+"\\n")}'
