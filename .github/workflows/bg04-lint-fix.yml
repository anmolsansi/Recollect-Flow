name: BG-04 lint fix

on:
  push:
    branches:
      - agent/ope-324-bg-04-smoke-story-setup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-324-bg-04-smoke-story-setup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove the unused stage helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-production-release.mjs')
          text = path.read_text()
          block = """function unavailableStage(name, reason, details = {}) {\n  const stage = {\n    name,\n    status: 'unavailable',\n    reason,\n    ...details,\n  };\n  stageResults.push(stage);\n  return stage;\n}\n\n"""
          if block not in text:
              raise SystemExit('Expected unused helper block was not found.')
          path.write_text(text.replace(block, '', 1))
          PY
      - run: npx prettier --write scripts/verify-production-release.mjs
      - run: npx eslint scripts/verify-production-release.mjs scripts/verify-production-release.test.mjs
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-production-release.mjs
          git commit -m "chore(smoke): remove dead stage helper [30/32] (#31)"
          git push origin HEAD:agent/ope-324-bg-04-smoke-story-setup
