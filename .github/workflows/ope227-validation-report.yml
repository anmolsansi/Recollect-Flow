name: OPE-227 validation report

on:
  push:
    branches:
      - agent/ope-227-capacity-controls
    paths-ignore:
      - docs/tickets/OPE-227-VALIDATION.tmp.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-227-capacity-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run validation and publish branch-local report
        shell: bash
        run: |
          set +e
          npm run check > /tmp/ope227-check.log 2>&1
          CHECK_EXIT=$?
          npm run db:migrate:local > /tmp/ope227-migrate.log 2>&1
          MIGRATE_EXIT=$?
          npx wrangler deploy --dry-run > /tmp/ope227-dryrun.log 2>&1
          DRYRUN_EXIT=$?
          set -e

          {
            echo "check_exit=${CHECK_EXIT}"
            echo "migrate_exit=${MIGRATE_EXIT}"
            echo "dryrun_exit=${DRYRUN_EXIT}"
            echo "=== check tail ==="
            tail -n 120 /tmp/ope227-check.log
            echo "=== migration tail ==="
            tail -n 80 /tmp/ope227-migrate.log
            echo "=== dry-run tail ==="
            tail -n 80 /tmp/ope227-dryrun.log
          } > docs/tickets/OPE-227-VALIDATION.tmp.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tickets/OPE-227-VALIDATION.tmp.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci(ope-227): refresh validation report'
          git push origin HEAD:agent/ope-227-capacity-controls
