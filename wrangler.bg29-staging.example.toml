# BG-29 example only: intentionally NOT deployable until isolated staging approval.
# NEVER replace the production wrangler.toml with this file.
# No production D1 identifiers, R2 buckets, routes or automatic Cron triggers.
name = "recollect-flow-bg29-staging"
main = "apps/worker-api/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api", "/api/*", "/", "/capture", "/capture/*", "/items/*", "/assets/*"]

[[d1_databases]]
binding = "DB"
database_name = "recollect-flow-bg29-staging"
database_id = "REPLACE_AFTER_EXPLICIT_ISOLATED_STAGING_APPROVAL"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "recollect-flow-bg29-staging-attachments"

[vars]
MAX_ATTACHMENT_BYTES = "25000000"
UPLOAD_TTL_SECONDS = "3600"
MOCK_AI_ENABLED = "true"
AI_PROVIDER_DEFAULT = "openrouter"
AI_PROVIDERS_ENABLED = "openrouter"
AI_PROVIDER_IMPLEMENTATIONS = '{"openrouter":"mock"}'
DIGEST_AI_ENABLED = "false"
HOSTED_BACKUP_AUTOCREATE_ENABLED = "false"
WEB_INBOX_BASE_URL = "https://invalid.test"

# Deliberately omit [ai], secrets, production routes and [triggers].
# Before any hosted test, stub/deny Notion and all real network providers.
