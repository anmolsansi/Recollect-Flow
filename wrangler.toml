name = "recollect-flow"
account_id = "a9482fbfb91ace26dee097cbd41293f9"
main = "apps/worker-api/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "none"
# API paths and approved SPA routes bypass asset-first serving.
# Hashed bundle paths run through Worker for explicit immutable caching.
run_worker_first = ["/api", "/api/*", "/", "/capture", "/capture/*", "/items/*", "/assets/*"]

# Per-edge, short-window login abuse limit. Unique namespace for this Worker.
# Bounded client keys are derived only from Cloudflare's connecting-IP header.
[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "250125"
simple = { limit = 8, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "recollect-flow-prod-v2"
database_id = "76bd35c6-c833-4987-a47e-6aa8238bb832"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "recollect-flow-attachments-prod-v2"

[ai]
binding = "AI"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[secrets]
required = ["CAPTURE_TOKEN", "ADMIN_TOKEN", "LOCAL_WORKER_TOKEN", "WEB_INBOX_BASE_URL"]

[vars]
NOTION_DATABASE_ID = ""
MAX_ATTACHMENT_BYTES = "25000000"
UPLOAD_TTL_SECONDS = "3600"
AI_PROVIDER_DEFAULT = "openrouter"
AI_PROVIDERS_ENABLED = ""
AI_PROVIDER_IMPLEMENTATIONS = '{}'
OPENROUTER_FREE_ACCOUNT_TIER = "standard"
CLOUDFLARE_AI_FREE_DAILY_NEURONS = "10000"
DIGEST_AI_ENABLED = "false"

# First release: metered R2 accepted; provider work remains disabled.
HOSTED_SCHEDULED_WORK_ENABLED = "false"
HOSTED_EXTERNAL_DISPATCH_ENABLED = "false"
HOSTED_HTTP_DISPATCH_ENABLED = "false"
HOSTED_BACKUP_AUTOCREATE_ENABLED = "false"
# No Cron. Provider credentials/configuration require a separate reviewed change.
