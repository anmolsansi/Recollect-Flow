name = "recollect-flow"
main = "apps/worker-api/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "none"
# API paths and approved SPA routes bypass asset-first serving.
# Hashed bundle paths run through Worker for explicit immutable caching.
run_worker_first = ["/api", "/api/*", "/", "/capture", "/capture/*", "/items/*", "/operations", "/digests", "/assets/*"]

# Per-edge, short-window login abuse limit. Unique namespace for this Worker.
# Bounded client keys are derived only from Cloudflare's connecting-IP header.
[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "250125"
simple = { limit = 8, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "recollect-flow-prod"
database_id = "5fcba514-d0f7-45e7-a632-d4c59233af71"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "recollect-flow-attachments-prod"

[ai]
binding = "AI"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[secrets]
required = ["CAPTURE_TOKEN", "ADMIN_TOKEN", "LOCAL_WORKER_TOKEN", "NOTION_ACCESS_TOKEN", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "WEB_INBOX_BASE_URL"]

[vars]
NOTION_DATABASE_ID = "3a21b726-4ada-80a3-bfe1-ef808e3c293f"
MAX_ATTACHMENT_BYTES = "25000000"
UPLOAD_TTL_SECONDS = "3600"
AI_PROVIDER_DEFAULT = "openrouter"
AI_PROVIDERS_ENABLED = "openrouter,cloudflare"
AI_PROVIDER_IMPLEMENTATIONS = '{"openrouter":"openrouter","cloudflare":"cloudflare"}'
OPENROUTER_FREE_ACCOUNT_TIER = "standard"
CLOUDFLARE_AI_FREE_DAILY_NEURONS = "10000"
DIGEST_AI_ENABLED = "false"

[triggers]
crons = ["17 * * * *", "0 2 * * *", "15 2 * * 1"]
